<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícias Diárias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-container">
            <h1 class="logo">⚡ Info|<span>Portal</span></h1>
            <button id="theme-toggle" class="btn-theme">Alternar Tema</button>
        </div>
        <nav>
            <ul class="nav-links">
                <li><button class="nav-btn active" data-category="todas">Todas</button></li>
                <li><button class="nav-btn" data-category="tecnologia">Tecnologia</button></li>
                <li><button class="nav-btn" data-category="esportes">Esportes</button></li>
                <li><button class="nav-btn" data-category="entretenimento">Entretenimento</button></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="featured-news" id="featured-section">
            </section>

        <h2>Últimas Notícias</h2>
        <section class="news-grid" id="news-grid">
            </section>
    </main>

    <footer>
        <p>&copy; 2026 InfoPortal. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
